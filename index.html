<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A validated Three.js mental rotation trainer using connected polycubes.">
  <title>Deca Spatial Rotation</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="app" data-state="question">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Deca Spatial Rotation home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span><strong>DECA</strong><small>Spatial Rotation</small></span>
      </a>
      <div class="controls">
        <label for="difficulty">Solid size</label>
        <select id="difficulty">
          <option value="6">Starter · 6 cubes</option>
          <option value="8" selected>Skilled · 8 cubes</option>
          <option value="10">Expert · 10 cubes</option>
        </select>
        <button id="new-session" type="button">New session</button>
      </div>
    </header>

    <section class="status" aria-label="Session status">
      <div>
        <span id="progress-label">Question 1 of 10</span>
        <div class="progress" role="progressbar" aria-label="Session progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
          <span id="progress-bar"></span>
        </div>
      </div>
      <span id="streak">No streak</span>
      <strong id="score">0 pts</strong>
    </section>

    <section class="exercise" aria-labelledby="question-heading">
      <div class="prompt">
        <p>MENTAL ROTATION</p>
        <h1 id="question-heading">Which option is the same solid, only rotated?</h1>
      </div>

      <div class="reference-wrap">
        <span class="view-caption">Reference</span>
        <div id="reference-view" class="reference-view"></div>
      </div>

      <div id="options" class="options" aria-label="Answer options"></div>

      <div class="response-row">
        <p id="feedback" class="feedback" aria-live="polite"></p>
        <button id="next-question" class="primary" type="button" hidden>Next puzzle</button>
      </div>
    </section>

    <footer>
      <span>Choose with A–D or 1–4</span>
      <span>96 validated puzzles · proper rotations only</span>
    </footer>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
